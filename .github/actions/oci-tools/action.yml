# oras pushes the catalog and the patch feed, cosign signs and verifies them
# (scripts/push-signed.sh). Pinned, the binaries checked against their release checksums - the
# versions and checksums of BRF-Tech/runr-runtimes (.github/actions/patch-feed-tools).
name: OCI tools
description: oras and cosign for scripts/push-signed.sh

runs:
  using: composite
  steps:
    - name: Install oras and cosign (pinned, checksums verified)
      shell: bash
      env:
        ORAS_VERSION: 1.3.4
        ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
        COSIGN_VERSION: v2.6.5
        COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
      run: |
        curl -fsSL -o /tmp/oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
        echo "${ORAS_SHA256}  /tmp/oras.tar.gz" | sha256sum -c -
        sudo tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
        curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
        sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
        oras version | head -n 1
        cosign version 2>&1 | grep -i '^gitversion'
